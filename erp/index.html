<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinod Institute ERP - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-left">
            <div class="login-brand">
                <div class="logo-icon">VI</div>
                <h2>Vinod Institute ERP</h2>
            </div>
            <p class="login-subtitle">Student Management System</p>

            <div class="login-tabs">
                <button class="tab-btn active" data-role="student">Student / Parent</button>
                <button class="tab-btn" data-role="admin">Admin</button>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="userId"><i class="fa-solid fa-user"></i> User ID</label>
                    <input type="text" id="userId" placeholder="Enter your ID" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div id="loginError" class="error-msg"></div>
                <button type="submit" class="btn-primary w-100">Login to Dashboard <i
                        class="fa-solid fa-arrow-right"></i></button>
            </form>
        </div>
        <div class="login-right">
            <!-- Decorative image or illustration -->
            <div class="overlay">
                <h2>Welcome Back!</h2>
                <p>Track your academic progress, manage fees, and monitor attendance all in one place.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
